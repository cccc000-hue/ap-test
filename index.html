<script>
const CH={1:"緒論及細胞",2:"緒論及組織",3:"骨骼系統、肌肉系統",4:"神經系統",5:"循環系統",6:"淋巴系統",7:"呼吸系統",8:"免疫系統",9:"消化系統",10:"泌尿系統",11:"生殖系統",12:"內分泌系統",13:"皮膚系統",14:"感覺系統",15:"懷孕與生產系統",16:"成長與老化系統"};

const Q=[
// ========== CH1 緒論及細胞 ==========
{c:1,q:"以下哪個「不屬於」人體十個生理系統？",o:["肌肉系統","免疫系統","淋巴系統","內分泌系統"],a:1,e:"十個生理系統：骨骼、肌肉、神經、呼吸、心血管、淋巴、內分泌、消化、泌尿、生殖。免疫系統不在此列。"},
{c:1,q:"以下哪個屬於十個生理系統之一？",o:["免疫系統","感覺系統","心血管系統","皮膚系統"],a:2,e:"心血管系統是十個生理系統之一。"},
{c:1,q:"胸腔及腹腔之間由什麼結構分開？",o:["肋骨","腹膜","橫隔膜","胸膜"],a:2,e:"胸腔及腹腔之間由橫隔膜分開。"},
{c:1,q:"使用方向性詞彙對治療師的主要好處是什麼？",o:["提高治療效率","方便與客戶溝通","符合法律要求","減少醫療事故"],a:1,e:"使用方向性詞彙對治療師的好處是方便與客戶溝通。"},
{c:1,q:"以下哪個「不是」生命特徵？",o:["生殖","思考","消化","反應性"],a:1,e:"生命特徵：生殖、生長、移動、呼吸、反應性、消化、吸收、循環、同化、排泄。思考不在此列。"},
{c:1,q:"以下哪一組全部都是生命特徵？",o:["生殖、思考、移動、睡眠","生長、呼吸、同化、排泄","消化、免疫、循環、吸收","反應性、遺傳、代謝、感覺"],a:1,e:"生長、呼吸、同化、排泄都屬於生命特徵。"},
{c:1,q:"pH 3 屬於什麼性質？",o:["鹼性","中性","酸性","強鹼性"],a:2,e:"pH 1-6為酸性，pH 7為中性，pH 8-14為鹼性。"},
{c:1,q:"pH 7 代表什麼性質？",o:["弱酸性","中性","弱鹼性","強酸性"],a:1,e:"pH 7為中性(Neutral)。"},
{c:1,q:"pH 10 屬於什麼性質？",o:["酸性","中性","鹼性","超強酸性"],a:2,e:"pH 8-14為鹼性(Base)。"},
{c:1,q:"以下哪個「不是」四個基本細胞結構之一？",o:["細胞膜","粒線體","細胞質","細胞核質"],a:1,e:"四個基本細胞結構：細胞膜、細胞質、細胞核、細胞核質。粒線體不在此列。"},
{c:1,q:"細胞膜的結構模型稱為什麼？",o:["雙層脂質模型","流體鑲嵌模型","三層膜模型","單層蛋白模型"],a:1,e:"細胞膜是流體鑲嵌模型結構，由雙層磷脂質和蛋白質組成。"},
{c:1,q:"細胞膜屬於什麼類型的膜？",o:["完全透膜","不透膜","選擇性半透膜","全透膜"],a:2,e:"細胞膜是選擇性半透膜。"},
{c:1,q:"以下哪個「不是」細胞膜的功能？",o:["圍牆保護","運輸物質","基因複製","細胞間溝通"],a:2,e:"細胞膜功能：圍牆、運輸、細胞間溝通。基因複製是細胞核的功能。"},

// ========== CH2 緒論及組織 ==========
{c:2,q:"以下哪個「不是」水分在人體中的功能？",o:["運輸廢棄物","製造紅血球","調節體溫","潤滑關節"],a:1,e:"水分功能：運輸、調節體溫、化學反應媒介、分解食物、潤滑、保護。製造紅血球是骨髓功能。"},
{c:2,q:"水分在化學反應中參與哪些過程？",o:["合成和水解","氧化和還原","發酵和分解","凝固和溶解"],a:0,e:"水分參與化學反應中的合成和水解過程。"},
{c:2,q:"水分作為「生理功能進行中的媒介」，這代表什麼？",o:["水是多種生化反應發生所需的環境介質","水能直接消滅病原體","水負責製造細胞","水負責合成蛋白質"],a:0,e:"水分作為生理功能進行中的媒介，是體內多種生化反應的必要環境。"},
{c:2,q:"水分在消化中扮演什麼角色？",o:["只負責潤滑","協助分解消化中的食物","分泌消化酶","製造膽汁"],a:1,e:"水分協助分解消化中的食物，也潤滑食物吞嚥。"},
{c:2,q:"以下哪個「不是」水分提供保護的例子？",o:["淚水","羊水","膽汁","腦脊液"],a:2,e:"水分的保護作用例子：淚水、羊水、腦脊液。"},
{c:2,q:"水分缺失「不會」直接導致以下哪個影響？",o:["低血壓","骨質疏鬆","腎功能衰竭","便秘"],a:1,e:"水分缺失影響：低血壓、血液凝固、腎功能衰竭、便秘、多重器官衰竭、感染、電解質不平衡。"},
{c:2,q:"脫水為什麼會增加凝血風險？",o:["血管擴張","血液變得較濃稠","血小板增多","血管收縮"],a:1,e:"脫水會使血液變得較濃稠，增加凝血風險。"},
{c:2,q:"嚴重脫水可能導致以下哪個最嚴重後果？",o:["頭痛","多重器官衰竭","皮膚乾燥","口渴"],a:1,e:"水分缺失嚴重時可導致多重器官衰竭。"},
{c:2,q:"電解質平衡對人體的意義是什麼？",o:["提供能量","維持細胞和器官正常生理","增強免疫力","促進骨骼生長"],a:1,e:"電解質平衡對維持細胞和器官的正常生理非常重要。"},
{c:2,q:"細胞核中對人體最重要的東西是什麼？",o:["蛋白質","基因遺傳資料(DNA、RNA)","脂肪","礦物質"],a:1,e:"細胞核中重要的是基因遺傳資料：DNA脫氧核醣核酸和RNA核糖核酸。"},
{c:2,q:"人類細胞中有多少條染色體？",o:["22對(44條)","23對(46條)","24對(48條)","20對(40條)"],a:1,e:"人類細胞中有23對(46條)染色體。"},
{c:2,q:"以下哪個「不是」四種人體組織之一？",o:["上皮組織","骨骼組織","肌肉組織","神經組織"],a:1,e:"四種人體組織：上皮組織、結締組織、肌肉組織、神經組織。"},
{c:2,q:"胞外基質對人體有什麼作用？",o:["產生能量","加強結締組織承受重量和張力等能力","傳遞神經訊號","調節體溫"],a:1,e:"胞外基質加強結締組織對承受重量、張力、侵害、磨損等能力。"},
{c:2,q:"外耳的軟骨屬於哪種類型？",o:["透明軟骨","彈性軟骨","纖維軟骨","硬骨"],a:1,e:"外耳為彈性軟骨。"},
{c:2,q:"肋骨和氣道的軟骨屬於什麼類型？",o:["彈性軟骨","纖維軟骨","透明軟骨","混合軟骨"],a:2,e:"肋骨和氣道為透明軟骨。"},
{c:2,q:"椎間盆間的肌腱韌帶中的軟骨屬於什麼類型？",o:["透明軟骨","彈性軟骨","纖維軟骨","混合軟骨"],a:2,e:"椎間盆間的肌腱韌帶為纖維軟骨。"},
{c:2,q:"以下哪兩種組織具有較大的修復能力？",o:["肌肉組織和神經組織","上皮組織和結締組織","骨骼肌和心肌","軟骨和神經"],a:1,e:"上皮組織和結締組織具有更大的修復能力。"},
{c:2,q:"以下哪種組織的修復/再生能力較弱？",o:["上皮組織","結締組織","心肌纖維","皮膚表皮"],a:2,e:"軟骨組織、骨骼肌纖維、平滑肌纖維、肌肉組織、神經組織、及心肌纖維的修復/再生能力較弱。"},
{c:2,q:"開放性或大面積傷口會產生什麼現象？",o:["纖維化","肉芽化現象","鈣化","硬化"],a:1,e:"開放性或大面積傷口會產生肉芽化現象。"},

// ========== CH3 骨骼系統、肌肉系統 ==========
{c:3,q:"負責所有身體運動的是哪個系統？",o:["骨骼系統","神經系統","肌肉系統","循環系統"],a:2,e:"肌肉系統負責所有的身體運動。"},
{c:3,q:"負責賦予形體及移動能力的是哪個系統？",o:["肌肉系統","骨骼系統","神經系統","內分泌系統"],a:1,e:"骨骼系統負責賦予形體及移動的能力。"},
{c:3,q:"與骨骼及肌肉系統協作的還有哪個系統？",o:["消化系統","呼吸系統","神經系統","內分泌系統"],a:2,e:"跟骨骼系統及肌肉系統協作的還有神經系統。"},
{c:3,q:"骨骼在運動功能中扮演什麼角色？",o:["引擎","槓桿","緩衝器","傳感器"],a:1,e:"骨骼扮演槓桿的角色，配合肌腱韌帶和關節做出各種動作。"},
{c:3,q:"硬骨儲存的礦物質包括？",o:["鈉鉀氯","鈣鎂磷","鐵鋅銅","碘硒錳"],a:1,e:"硬骨儲存礦物質：鈣、鎂、磷，需要時釋放使用。"},
{c:3,q:"以下哪些器官受到骨骼系統保護？",o:["胃、腸、膀胱","腦部、心肺、脊髓","肌肉、皮膚、脂肪","眼球、耳朵、鼻子"],a:1,e:"顱骨保護腦部、胸骨肋骨保護心肺、脊骨保護脊髓、盆骨保護生殖器官。"},
{c:3,q:"硬骨裡負責持續製造紅血球和白血球的是什麼？",o:["黃骨髓","骨膜","紅骨髓","骨皮質"],a:2,e:"硬骨裡的紅骨髓負責持續製造紅血球和白血球。"},
{c:3,q:"骨折後首先由什麼細胞移除壞死組織？",o:["成骨細胞","巨噬細胞","紅血球","血小板"],a:1,e:"首先由巨噬細胞(Macrophage)移除壞死的硬骨組織。"},
{c:3,q:"骨折癒合需要哪些離子的補足？",o:["鈉離子和鉀離子","鈣離子和磷離子","鐵離子和鋅離子","鎂離子和氯離子"],a:1,e:"骨折癒合需要鈣離子和磷離子的補足，過程需時數月。"},
{c:3,q:"膝關節屬於什麼類型的關節？",o:["不動關節","微動關節","可動關節","纖維關節"],a:2,e:"膝關節屬於可動關節，具有關節腔和滑液囊。"},
{c:3,q:"關節滑膜的主要功能是什麼？",o:["保護骨骼","分泌滑液","傳遞訊號","儲存礦物質"],a:1,e:"滑膜產生滑液，作為硬骨相接處的軟墊，起潤滑和緩衝作用。"},
{c:3,q:"滑液在關節中的作用是什麼？",o:["儲存礦物質","作為硬骨相接處的軟墊，潤滑和緩衝","傳遞神經訊號","製造血球"],a:1,e:"滑液作為硬骨相接處的軟墊，起到潤滑和緩衝作用。"},
{c:3,q:"肌肉系統由哪三種肌肉組成？",o:["橫紋肌、斜紋肌、環形肌","心肌、骨骼肌、平滑肌","紅肌、白肌、混合肌","快肌、慢肌、中間肌"],a:1,e:"肌肉系統由心肌、骨骼肌及平滑肌組成。"},
{c:3,q:"骨骼肌持續進行細微調整的目的是什麼？",o:["產生熱能","維持平衡和直立姿勢","消化食物","傳遞訊號"],a:1,e:"骨骼肌持續進行細微調整，令身軀得以平衡和維持直立姿勢。"},
{c:3,q:"骨骼肌和肌腱收縮時，除了產生動作還會怎樣？",o:["破壞關節","穩定關節","溶解骨骼","增加脂肪"],a:1,e:"骨骼肌和肌腱收縮的時候，在活動同時也穩定關節。"},
{c:3,q:"腹壁的骨骼肌有什麼功能？",o:["只負責運動","保障腹腔內的器官","產生激素","分泌消化液"],a:1,e:"腹壁的骨骼肌保障腹腔內的器官，消化道泌尿道出入口都被骨骼肌圍繞。"},
{c:3,q:"肌肉收縮時ATP釋放能量，其中多少比例轉化成熱能？",o:["1/2","1/4","2/3","3/4"],a:3,e:"ATP釋放的能量中，3/4會轉化成熱能。"},
{c:3,q:"筋膜延伸成什麼結構將肌肉連接到硬骨？",o:["韌帶","肌腱或肌腱膜","神經纖維","血管"],a:1,e:"筋膜延伸成肌腱或肌腱膜，將肌肉連接到硬骨、軟骨或結締組織。"},
{c:3,q:"筋膜除了圍繞支持肌肉，還提供什麼通道？",o:["消化管道","神經、淋巴管和血管的進出通道","呼吸氣道","尿道"],a:1,e:"筋膜圍繞並支持肌肉系統，亦提供神經、淋巴管和血管的進出通道。"},
{c:3,q:"骨骼肌由什麼系統支配和控制？",o:["內分泌系統","消化系統","神經系統","循環系統"],a:2,e:"骨骼肌由神經系統支配/控制，以軸突產生的神經遞質傳遞電訊號。"},
{c:3,q:"以下哪個屬於帶氧(Aerobic)運動？",o:["Heavy Weight-Lifting","跳繩","跑步","Interval Training"],a:2,e:"帶氧運動例子：跑步、游水、步行、跳舞等。"},
{c:3,q:"以下哪個屬於無氧(Anaerobic)運動？",o:["游水","步行","跳舞","Heavy Weight-Lifting"],a:3,e:"無氧運動例子：Heavy Weight-Lifting、跳繩、Interval Training等。"},
{c:3,q:"斜方肌「不能」產生以下哪個動作？",o:["轉動頭頸","聳肩","高舉雙手","彎曲膝蓋"],a:3,e:"斜方肌可產生：轉動、向後伸展、向側屈曲頭頸、聳肩、高舉雙手等動作。"},
{c:3,q:"在梨狀肌下方經過的神經束叫什麼？",o:["股神經","正中神經","坐骨神經","腓神經"],a:2,e:"在梨狀肌下方經過的神經束叫坐骨神經。"},
{c:3,q:"以下哪個「不是」骨骼系統的五大功能之一？",o:["支持形體","分泌激素","儲存礦物質","製造血球"],a:1,e:"骨骼系統五功能：支持、運動、儲存、保護、製造。分泌激素非其功能。"},

// ========== CH4 神經系統 ==========
{c:4,q:"神經系統主要負責身體的什麼功能？",o:["能量代謝","溝通和調控","消化吸收","免疫防禦"],a:1,e:"神經系統負責身體的溝通和調控系統。"},
{c:4,q:"自主神經系統包含哪兩組神經？",o:["感覺神經和運動神經","中樞神經和周圍神經","交感神經和副交感神經","腦神經和脊神經"],a:2,e:"自主神經系統包含交感神經及副交感神經兩組。"},
{c:4,q:"「戰鬥或逃跑」反應由什麼神經主導？",o:["副交感神經","交感神經","迷走神經","感覺神經"],a:1,e:"「戰鬥或逃跑」由交感神經主導。"},
{c:4,q:"「休息和消化」反應由什麼神經主導？",o:["交感神經","運動神經","副交感神經","感覺神經"],a:2,e:"「休息和消化」由副交感神經主導。"},
{c:4,q:"交感神經激勵後，瞳孔會怎樣？",o:["收縮","不變","擴張","關閉"],a:2,e:"交感神經：瞳孔擴張(Dilate)。"},
{c:4,q:"交感神經對心臟有什麼影響？",o:["減緩心跳","增加心跳","無影響","停止心跳"],a:1,e:"交感神經：增加心跳(Increases heartbeat)。"},
{c:4,q:"交感神經對消化系統有什麼影響？",o:["刺激活動","降低活動","無影響","增加分泌"],a:1,e:"交感神經使消化系統降低活動。"},
{c:4,q:"交感神經對肝臟有什麼影響？",o:["刺激膽汁釋放","增加肝糖轉化為葡萄糖的速率","減少血糖","降低代謝"],a:1,e:"交感神經增加肝糖轉化為葡萄糖的速率。"},
{c:4,q:"交感神經對泌尿系統有什麼影響？",o:["增加尿量排出","放鬆膀胱","收縮膀胱","無影響"],a:1,e:"交感神經：放鬆膀胱(Relaxes bladder)。"},
{c:4,q:"交感神經對汗腺有什麼影響？",o:["抑制分泌","刺激分泌","無影響","關閉汗腺"],a:1,e:"交感神經：刺激汗腺分泌(Stimulates secretion)。"},
{c:4,q:"交感神經對呼吸道有什麼影響？",o:["收縮支氣管","擴張支氣管","無影響","關閉氣道"],a:1,e:"交感神經：擴張支氣管(Dilates the bronchial tubules)。"},
{c:4,q:"交感神經對子宮有什麼影響？",o:["放鬆","陰道收縮","無影響","增加月經"],a:1,e:"交感神經：陰道收縮(Vaginal contraction)。"},
{c:4,q:"副交感神經激勵後，心跳會怎樣？",o:["增加","不變","減緩","停止"],a:2,e:"副交感神經：減緩心跳(Slow heartbeat)。"},
{c:4,q:"副交感神經激勵後，瞳孔會怎樣？",o:["擴張","收縮","不變","閃動"],a:1,e:"副交感神經：瞳孔收縮(Constriction)。"},
{c:4,q:"副交感神經對呼吸道有什麼影響？",o:["擴張支氣管","收縮支氣管","無影響","增加分泌"],a:1,e:"副交感神經：收縮支氣管。"},
{c:4,q:"副交感神經對肝臟有什麼影響？",o:["增加肝糖轉化","刺激膽汁釋放","分解脂肪","無影響"],a:1,e:"副交感神經：刺激膽汁釋放。"},
{c:4,q:"副交感神經對血管有什麼影響？",o:["擴張","收縮","無影響","破裂"],a:1,e:"副交感神經：血管收縮(Constriction)。"},
{c:4,q:"副交感神經對泌尿系統有什麼影響？",o:["放鬆膀胱","減少尿量","增加尿量排出","無影響"],a:2,e:"副交感神經：增加尿量排出。"},
{c:4,q:"副交感神經對消化系統有什麼影響？",o:["降低活動","刺激活動","無影響","停止消化"],a:1,e:"副交感神經：刺激消化系統活動。"},
{c:4,q:"副交感神經對子宮有什麼影響？",o:["收縮","放鬆","無影響","增加出血"],a:1,e:"副交感神經：子宮放鬆(Relaxation)。"},
{c:4,q:"交感神經會刺激哪個腺體產生腎上腺素？",o:["甲狀腺","腎上腺","腦下腺","胰臟"],a:1,e:"交感神經：刺激腎上腺素的產生。"},
{c:4,q:"神經元之間的連接需倚賴什麼物質？",o:["激素","電解質","神經遞質","血清蛋白"],a:2,e:"神經元之間的連接需倚賴神經遞質(神經傳遞物質)。"},
{c:4,q:"以下哪個「不是」神經遞質？",o:["多巴胺","血清素","胰島素","乙酰膽鹼"],a:2,e:"神經遞質包括：腎上腺素、去甲腎上腺素、多巴胺、血清素、GABA、乙酰膽鹼、谷氨酸、內啡肽。胰島素是激素。"},
{c:4,q:"以下哪個是神經遞質？",o:["甲狀腺素","皮質醇","內啡肽(Endorphins)","胰島素"],a:2,e:"內啡肽(Endorphins)是神經遞質之一。"},
{c:4,q:"GABA 氨基丁酸屬於什麼類別？",o:["激素","神經遞質","礦物質","維生素"],a:1,e:"GABA氨基丁酸是神經遞質之一。"},
{c:4,q:"腦膜包括哪三層？",o:["硬腦膜、蜘蛛膜、軟腦膜","外膜、中膜、內膜","表皮、真皮、皮下","骨膜、軟骨膜、韌帶"],a:0,e:"腦膜三層：軟腦膜、蜘蛛膜、硬腦膜。"},
{c:4,q:"腦部可分為幾個解剖區？",o:["兩個","三個","四個","五個"],a:2,e:"腦部四個解剖區：大腦、間腦、腦幹、小腦。"},
{c:4,q:"以下哪個「不是」腦部的四個解剖區之一？",o:["大腦 Cerebrum","間腦 Diencephalon","脊髓 Spinal Cord","小腦 Cerebellum"],a:2,e:"腦部四區：大腦、間腦、腦幹、小腦。脊髓不屬於腦部。"},
{c:4,q:"第一對腦神經是什麼？",o:["視神經","嗅覺神經","動眼神經","聽覺神經"],a:1,e:"第I對腦神經是嗅覺神經(Olfactory nerve)。"},
{c:4,q:"第二對腦神經是什麼？",o:["嗅覺神經","視神經","動眼神經","三叉神經"],a:1,e:"第II對腦神經是視神經(Optic nerve)。"},
{c:4,q:"第五對腦神經是什麼？",o:["外展神經","滑車神經","三叉神經","顏面神經"],a:2,e:"第V對腦神經是三叉神經(Trigeminal nerve)。"},
{c:4,q:"第七對腦神經是什麼？",o:["三叉神經","顏面神經","前庭耳窩神經","舌咽神經"],a:1,e:"第VII對腦神經是顏面神經(Facial nerve)。"},
{c:4,q:"第八對腦神經是什麼？",o:["顏面神經","前庭耳窩神經","舌咽神經","迷走神經"],a:1,e:"第VIII對腦神經是前庭耳窩神經(Vestibulocochlear nerve)。"},
{c:4,q:"第十對腦神經是什麼？",o:["三叉神經","顏面神經","迷走神經","舌下神經"],a:2,e:"第X對腦神經是迷走神經(Vagus nerve)。"},
{c:4,q:"人體共有多少對腦神經？",o:["10對","12對","14對","31對"],a:1,e:"人體共有12對腦神經。"},
{c:4,q:"三組腦神經分類「不包括」以下哪個？",o:["感覺神經","運動神經","混合神經","自主神經"],a:3,e:"三組腦神經：感覺神經、運動神經、混合神經。"},
{c:4,q:"人體神經系統中有多少對脊神經？",o:["12對","21對","31對","41對"],a:2,e:"人體神經系統中有31對脊神經。"},

// ========== CH5 循環系統 ==========
{c:5,q:"循環系統的主要功能是什麼？",o:["產生激素","分布養分、氣體和電解質","消化食物","過濾血液"],a:1,e:"循環系統主要功能：分布養分、氣體、電解質，運送代謝廢物。"},
{c:5,q:"循環系統由哪兩個系統組成？",o:["動脈和靜脈系統","血液循環和淋巴循環系統","心臟和肺部系統","神經和內分泌系統"],a:1,e:"循環系統由血液循環系統及淋巴循環系統組成。"},
{c:5,q:"血液循環系統有幾種路徑？",o:["兩種","三種","四種","五種"],a:2,e:"四種路徑：體循環、肺循環、肝門循環、胎兒循環。"},
{c:5,q:"負責血液循環系統的器官和組織包括什麼？",o:["淋巴結、淋巴管和淋巴液","心臟、血管和血液","肝臟、膽囊和胰臟","肺部、氣管和支氣管"],a:1,e:"負責血液循環系統的器官和組織包括：心臟、血管和血液。"},
{c:5,q:"肺循環主要負責什麼？",o:["過濾血液","運送缺氧血及含氧血來回心臟和肺部","分泌激素","排泄廢物"],a:1,e:"肺循環負責運送缺氧血及含氧血來回心臟和肺部。"},
{c:5,q:"肝門循環的功能是什麼？",o:["將血液送到腎臟","將血液由腸胃系統送進肝臟","將血液送到肺部","將血液送到腦部"],a:1,e:"肝門循環將血液由腸胃系統送進肝臟。"},
{c:5,q:"動脈血管的血流方向是？",o:["回流心臟","離開心臟","雙向流動","靜止不動"],a:1,e:"動脈是以「離開心臟」的方向行走。"},
{c:5,q:"靜脈血管有什麼結構而動脈沒有？",o:["彈性組織","內置瓣膜","平滑肌","內皮細胞"],a:1,e:"靜脈有內置瓣膜，動脈沒有。"},
{c:5,q:"以下關於動脈和靜脈的比較，哪個是正確的？",o:["動脈管腔較寬","靜脈血壓較高","動脈較深藏於體內","靜脈彈性組織較多"],a:2,e:"動脈較深藏於體內、管腔窄、血壓高、彈性多。靜脈位於淺表、管腔寬、血壓低。"},
{c:5,q:"關於動脈的彈性組織，以下哪個描述正確？",o:["動脈彈性組織較多","動脈彈性組織較少","動脈沒有彈性組織","動脈和靜脈彈性組織相同"],a:0,e:"動脈的彈性組織較多，靜脈較少或沒有。"},
{c:5,q:"靜脈在體內的位置通常是？",o:["深藏於體內","位於較淺表位置","只在胸腔內","只在腹腔內"],a:1,e:"靜脈位於身體較淺表的位置；動脈較深藏於體內。"},
{c:5,q:"微血管(Capillary)的特性「不包括」？",o:["血管壁薄","滲透性高","管腔粗大","氣體交換在此發生"],a:2,e:"微血管管道狹小，紅血球要變型才能通過。"},
{c:5,q:"收縮壓(上壓)反映什麼？",o:["心臟放鬆時的壓力","心臟收縮泵出血液時血管內的壓力","血管壁的彈性","血液的黏稠度"],a:1,e:"收縮壓顯示心臟收縮泵出血液時血管內的壓力。"},
{c:5,q:"舒張壓(下壓)表示什麼？",o:["運動時的血壓","心臟放鬆時血管內的壓力","最大血壓值","血管破裂的壓力"],a:1,e:"舒張壓表示在心跳之間心臟放鬆時血管內的壓力。"},
{c:5,q:"以下哪個「不是」影響血壓的因素？",o:["自主神經","激素(荷爾蒙)","血型","腎素-血管收縮素"],a:2,e:"影響血壓因素：自主神經、激素、自主因素(腎素-血管收縮素)。"},
{c:5,q:"成人體內約有多少血液量？",o:["3公升","5公升","7公升","10公升"],a:1,e:"成人有5公升的血液量。"},
{c:5,q:"以下哪個「不是」血液的功能？",o:["運輸","產生激素","維持體溫","凝血"],a:1,e:"血液功能：運輸、維持體溫、維持pH、調節液體平衡、移除廢物、凝血、免疫防禦。"},
{c:5,q:"血液的功能包括維持酸鹼度(pH)和什麼？",o:["產生激素","調節液體平衡","分解脂肪","合成蛋白質"],a:1,e:"血液功能包括：維持pH和調節液體平衡。"},
{c:5,q:"紅血球在微血管中需要怎樣才能通過？",o:["加速","變型","分裂","縮小"],a:1,e:"微血管管道狹小，紅血球要變型才能通過。"},

// ========== CH6 淋巴系統 ==========
{c:6,q:"淋巴循環系統的器官和組織包括？",o:["心臟、血管和血液","淋巴結、淋巴管和淋巴液","肝臟、脾臟和胰臟","腎臟、膀胱和尿道"],a:1,e:"淋巴循環系統：淋巴結、淋巴管和淋巴液。"},
{c:6,q:"淋巴管道由什麼結構開始？",o:["心臟","盲端管子","鎖骨下靜脈","淋巴結"],a:1,e:"淋巴管道由盲端管子開始(單向管道)。"},
{c:6,q:"淋巴最終進入哪個血管回流到心臟？",o:["主動脈","肺動脈","鎖骨下靜脈","肝門靜脈"],a:2,e:"淋巴最終進入鎖骨下靜脈，回流進入心臟的血液循環系統。"},
{c:6,q:"以下哪個位置「不太可能」找到淋巴結？",o:["頸部","腋下","手掌","腹股溝"],a:2,e:"淋巴結位置：頸部、胸腹部中線、腋下、肘窩、腹股溝、膕窩。"},
{c:6,q:"哪種血球「不會」存在於淋巴液中？",o:["白血球","紅血球","淋巴球","巨噬細胞"],a:1,e:"紅血球不會存在於淋巴液中。"},
{c:6,q:"淋巴結內能找到哪些免疫細胞？",o:["紅血球和血小板","T淋巴細胞和B淋巴細胞","成骨細胞和破骨細胞","上皮細胞和纖維細胞"],a:1,e:"淋巴結內能找到T淋巴細胞和B淋巴細胞。"},
{c:6,q:"淋巴循環是什麼形式的網絡？",o:["封閉的網絡","雙向的網絡","單向的網絡","環形的網絡"],a:2,e:"淋巴循環是單向的網絡；血液循環是封閉的網絡。"},
{c:6,q:"以下哪個「不是」淋巴系統的功能？",o:["摧毀病原體","收回多餘水份","產生紅血球","運送養分和氧氣"],a:2,e:"淋巴功能：摧毀病原體、收回多餘水份、收集蛋白質、運送養分氧氣激素。"},
{c:6,q:"淋巴系統收集由細胞生產的什麼物質運送回血液？",o:["脂肪","蛋白質","糖分","礦物質"],a:1,e:"淋巴系統收集由細胞生產的蛋白質，運送回血液中。"},
{c:6,q:"血液循環是什麼形式的網絡？",o:["單向的網絡","開放的網絡","封閉的網絡","分支的網絡"],a:2,e:"血液循環是封閉的網絡。"},

// ========== CH7 呼吸系統 ==========
{c:7,q:"呼吸系統的主要功能是什麼？",o:["消化食物","從大氣提取氧氣並處理掉二氧化碳","過濾血液","產生激素"],a:1,e:"呼吸系統：使人體從大氣中提取足夠氧氣，並處理掉過多的二氧化碳。"},
{c:7,q:"鼻腔內黏膜組織的作用「不包括」？",o:["溫暖空氣","濕潤空氣","黏著灰塵","分泌激素"],a:3,e:"鼻腔黏膜：溫暖和濕潤空氣，黏著灰塵，透過纖毛排出污濁黏液。"},
{c:7,q:"呼吸包括幾個過程？",o:["兩個","三個","四個","五個"],a:2,e:"四個過程：肺部通氣、外呼吸、氣體運輸、內呼吸。"},
{c:7,q:"外呼吸(External respiration)是指什麼？",o:["空氣進出肺部","氧氣由肺擴散至血液，CO₂從血液擴散至肺","氧氣和CO₂在體內運輸","氧氣送到體細胞"],a:1,e:"外呼吸：氧氣由肺擴散至血液中，二氧化碳從血液擴散至肺中。"},
{c:7,q:"內呼吸(Internal respiration)是指什麼？",o:["空氣進出肺部","肺部氣體交換","氧氣送至體細胞，CO₂從體細胞排出","血液運輸氧氣"],a:2,e:"內呼吸：氧氣運送至體細胞中，二氧化碳從體細胞中排出。"},
{c:7,q:"呼吸系統要配合哪個系統才能令氧氣和CO₂在體內循環？",o:["消化系統","心血管系統","泌尿系統","骨骼系統"],a:1,e:"呼吸系統要配合心血管系統。"},
{c:7,q:"以下哪個「不是」上呼吸系統的保護組織？",o:["鼻毛","黏液膜","肋骨","扁核體"],a:2,e:"上呼吸道保護：鼻毛、黏液膜、刺激物感受器、扁核體。肋骨保護下呼吸道。"},
{c:7,q:"口腔兩側的扁核體屬於什麼結構？",o:["肌肉組織","淋巴結","骨骼","神經"],a:1,e:"口腔兩側的扁核體是淋巴結，屬於上呼吸道保護結構。"},
{c:7,q:"下呼吸道主要由什麼結構保護？",o:["鼻毛","扁核體","胸廓","黏液膜"],a:2,e:"由胸廓保護，前為胸骨，後為脊椎骨，兩側為肋骨。"},
{c:7,q:"吸氣時胸腔容積增加，肺臟增大，會出現什麼？",o:["空氣被排出肺部","空氣由外界進入肺部","肺內氣壓升高","胸廓收縮"],a:1,e:"肺內氣壓下降，導致空氣從外界經氣道進入肺部。"},
{c:7,q:"外呼吸在什麼部位發生？",o:["氣管","支氣管","肺泡","體細胞"],a:2,e:"外呼吸在肺泡發生(肺部氣體交換)。"},
{c:7,q:"內呼吸在什麼部位發生？",o:["肺泡","支氣管","細胞","鼻腔"],a:2,e:"內呼吸在細胞發生(體循環氣體交換)。"},
{c:7,q:"缺氧(Hypoxia)的症狀「不包括」？",o:["頭暈","骨折","耳鳴","噁心"],a:1,e:"缺氧症狀：頭暈、頭痛、耳鳴、眼花、四肢軟弱無力、噁心、嘔吐及心慌。"},
{c:7,q:"壓力梯度移動是指什麼？",o:["血液從高壓流向低壓","氧氣從高濃度的肺泡擴散到低濃度的肺循環","食物從口腔到胃部","尿液從腎臟到膀胱"],a:1,e:"肺泡中氧氣濃度高於肺循環，氧氣會從肺泡擴散到肺循環。"},

// ========== CH8 免疫系統 ==========
{c:8,q:"免疫力分為哪兩種型態？",o:["主動和被動","先天性和後天性","細胞和體液","物理和化學"],a:1,e:"免疫力分為先天性(Innate)和後天性(Acquired/Adaptive)。"},
{c:8,q:"先天性免疫是什麼時候具備的？",o:["青春期","成年後","出生時已具有","接種疫苗後"],a:2,e:"先天性免疫是出生時已具有的免疫力。"},
{c:8,q:"以下哪個「不是」先天性免疫的四個元素之一？",o:["物理性屏障","機械性屏障","抗體免疫","化學性屏障"],a:2,e:"先天免疫四元素：物理性屏障、機械性屏障、化學性屏障、血球細胞。"},
{c:8,q:"皮膚和黏膜屬於先天免疫的什麼屏障？",o:["化學性屏障","機械性屏障","物理性屏障","生物性屏障"],a:2,e:"物理性屏障包括皮膚和黏膜，阻擋微生物入侵。"},
{c:8,q:"以下哪個屬於先天免疫的化學性屏障？",o:["纖毛運動","皮膚黏膜","胃酸殺死病原體","打噴嚏"],a:2,e:"化學性屏障：汗水殺菌、淚液溶菌酶、胃酸殺死病原體。"},
{c:8,q:"以下哪個屬於先天免疫的機械性屏障？",o:["胃酸","纖毛運動和打噴嚏","皮膚","溶菌酶"],a:1,e:"機械性屏障：纖毛運動、打噴嚏、咳嗽及流眼淚。"},
{c:8,q:"發炎反應的四個症狀是什麼？",o:["癢、麻、脹、酸","紅、腫、熱、痛","乾、裂、硬、白","青、紫、黑、黃"],a:1,e:"發炎反應症狀：紅、腫、熱、痛。"},
{c:8,q:"發炎反應中，首先釋出細胞因子的是哪些細胞？",o:["紅血球和血小板","巨噬細胞和肥大細胞","B細胞和T細胞","成骨細胞和破骨細胞"],a:1,e:"受傷位置附近的巨噬細胞和肥大細胞釋出細胞因子。"},
{c:8,q:"發炎反應中，什麼物質離開血管進到受傷位置？",o:["紅血球和激素","體液、中性白血球及凝血因子","脂肪和蛋白質","膠原蛋白和鈣"],a:1,e:"體液、中性白血球及凝血因子離開血管進到受傷位置。"},
{c:8,q:"發炎反應最後階段，哪些細胞吞噬病原體令組織癒合？",o:["紅血球和血小板","中性白血球和巨噬細胞","B細胞和T細胞","成纖維細胞"],a:1,e:"中性白血球和巨噬細胞吞噬病原體和死去的細胞，令受傷的組織癒合。"},
{c:8,q:"以下哪個「不是」參與先天免疫的免疫細胞？",o:["巨噬細胞","自然殺手細胞","B淋巴細胞","中性白細胞"],a:2,e:"先天免疫細胞：巨噬細胞、NK細胞、中性白細胞、樹突細胞等。B淋巴細胞屬適應性免疫。"},
{c:8,q:"B淋巴細胞主要負責什麼？",o:["吞噬病原體","體液免疫，產生抗體","細胞免疫","分泌激素"],a:1,e:"B淋巴細胞負責體液免疫，產生抗體。"},
{c:8,q:"T淋巴細胞主要負責什麼？",o:["產生抗體","體液免疫","細胞免疫","分泌細胞因子"],a:2,e:"T淋巴細胞負責細胞免疫。"},
{c:8,q:"過敏反應分為多少個類型？",o:["2個","3個","4個","5個"],a:2,e:"過敏反應分為4個類型(第一型至第四型)。"},
{c:8,q:"第一型過敏反應約多久發生？",o:["2-30分鐘","1-3小時","1-3天","1-2週"],a:0,e:"第一型(即發性)：約2-30分鐘內發生。"},
{c:8,q:"第四型過敏反應約多久發生？",o:["2-30分鐘","1-3小時","1-3天","1-2週"],a:2,e:"第四型(遲發性)：約1-3天後才發生。"},
{c:8,q:"適應性免疫具有什麼特殊能力？",o:["快速反應","記憶性","非專一性","物理屏障"],a:1,e:"適應性免疫具有記憶性（記憶B細胞可存活數年並在二次感染時迅速反應）。"},
{c:8,q:"比較先天和適應性免疫，以下哪項正確？",o:["先天性反應慢","適應性是非專一的","先天性反應迅速，適應性反應較慢","先天性具記憶性"],a:2,e:"先天性反應迅速(Rapid)；適應性反應較慢(Slow)，需要時間啟動。"},

// ========== CH9 消化系統 ==========
{c:9,q:"消化系統的主要功能是什麼？",o:["產生激素","把食物轉換成可被吸收的小分子","過濾血液","排泄廢物"],a:1,e:"消化系統：把攝取的食物轉換成可被身體吸收和利用的小分子。"},
{c:9,q:"消化道的起點和終點分別在哪裡？",o:["鼻腔到肛門","口腔到直腸","食道到大腸","咽喉到盲腸"],a:1,e:"消化道由口腔開始到食道、胃、十二指腸、小腸、大腸(盲腸到直腸)。"},
{c:9,q:"小腸主要負責什麼功能？",o:["消化","吸收","排泄","儲存"],a:1,e:"小腸分為空腸和迴腸，負責吸收。"},
{c:9,q:"大腸除了吸收水份，還有什麼特點？",o:["分泌激素","造成微生物的溫床","產生消化酶","吸收蛋白質"],a:1,e:"大腸不單吸收水份，而且會造成微生物的溫床。"},
{c:9,q:"迷走神經又稱為第幾組顱神經？",o:["第八組","第九組","第十組","第十二組"],a:2,e:"迷走神經Vagus nerve又稱為第十組顱神經。"},
{c:9,q:"腹腔神經又稱為什麼？",o:["迷走神經叢","太陽神經叢","骶神經叢","臂神經叢"],a:1,e:"腹腔神經(Coeliac Plexus)又稱為太陽神經叢。"},
{c:9,q:"從腸胃系統將血液運送到肝臟的血管叫什麼？",o:["肝動脈","肝靜脈","肝門靜脈","肺靜脈"],a:2,e:"肝門靜脈(Hepatic Portal Vein)將血液由腸胃系統送進肝臟。"},
{c:9,q:"唾液的消化功能包括什麼？",o:["分解脂肪","潤滑食物和水解澱粉","分解蛋白質","中和胃酸"],a:1,e:"唾液可潤滑食物使其容易吞嚥，且含消化酵素幫助水解澱粉。"},
{c:9,q:"唾液的抗菌功能包括什麼？",o:["只有消化功能","含酵素與免疫球蛋白進行抗菌作用","只能殺死病毒","只能分解食物"],a:1,e:"唾液含有特殊酵素與免疫球蛋白，可進行非特異性(先天)與特異性(適應性)的抗菌作用。"},
{c:9,q:"胃部的容量為多少？",o:["10ml-1L","50ml-4L","100ml-2L","500ml-6L"],a:1,e:"胃部的容量為50ml-4L。"},
{c:9,q:"胃部能在餐後多久排空？",o:["1小時","2小時","4小時","6小時"],a:2,e:"胃部能在餐後4小時排空。"},
{c:9,q:"胃酸的pH值是多少？",o:["1-3","4-6","6-8","7-9"],a:0,e:"胃酸的pH值為1-3，有利蛋白質分解。"},
{c:9,q:"膽液由哪個器官製造？",o:["膽囊","胰臟","肝臟","小腸"],a:2,e:"膽液由肝臟(Liver)製造。"},
{c:9,q:"膽液在消化上的主要功能是什麼？",o:["分解蛋白質","乳化脂肪","水解澱粉","中和胃酸"],a:1,e:"膽液能乳化脂肪，增加胰脂肪酶接觸面，促進脂溶性維生素吸收。"},
{c:9,q:"膽液中含有的代謝副產物包括？",o:["葡萄糖和氨基酸","膽紅素和膽固醇","鈣和磷","鈉和鉀"],a:1,e:"膽液含代謝副產物：膽紅素(Bilirubin)、膽固醇(Cholesterol)、一些金屬和毒素。"},
{c:9,q:"胰臟分泌哪兩個荷爾蒙控制血糖？",o:["腎上腺素和正腎上腺素","胰島素和胰高血糖素","甲狀腺素和副甲狀腺素","動情素和黃體素"],a:1,e:"胰臟分泌胰島素(降血糖)和胰高血糖素(升血糖)。"},
{c:9,q:"胰液在什麼pH環境有利消化？",o:["pH 1-3","pH 4-5","pH 6-8","pH 9-11"],a:2,e:"胰液能中和胃酸，在pH 6-8的環境有利澱粉酶和脂肪酶工作。"},
{c:9,q:"小腸內的微絨毛構造有什麼作用？",o:["分泌消化液","令吸收面積增加160倍","保護腸壁","產生蠕動"],a:1,e:"小腸微絨毛令吸收面積增加160倍。"},
{c:9,q:"大腸杯狀細胞(Goblet cell)的功能是什麼？",o:["吸收水分","分泌黏液使糞便更易通過並保護大腸壁","產生消化酶","吸收營養"],a:1,e:"杯狀細胞分泌黏液，使糞便更容易通過，同時保護大腸壁。"},
{c:9,q:"小腸分為哪兩部分負責吸收？",o:["十二指腸和空腸","空腸和迴腸","迴腸和盲腸","盲腸和直腸"],a:1,e:"小腸分為空腸和迴腸，負責吸收。"},

// ========== CH10 泌尿系統 ==========
{c:10,q:"泌尿系統的主要功能「不包括」？",o:["維持身體恆定","排泄尿液移除廢物","分泌腎素和EPO","消化食物"],a:3,e:"泌尿系統功能：維持恆定、排泄廢物、分泌腎素和紅血球生成素等激素。"},
{c:10,q:"以下哪個「不屬於」泌尿系統的結構？",o:["腎臟","輸尿管","膀胱","膽囊"],a:3,e:"泌尿系統結構：腎臟、輸尿管、膀胱、尿道。"},
{c:10,q:"尿液形成的三個過程依序為何？",o:["分泌、過濾、吸收","過濾、選擇性再吸收、分泌","吸收、分泌、過濾","過濾、分泌、排泄"],a:1,e:"尿液形成：過濾→選擇性再吸收→分泌。"},
{c:10,q:"腎臟產生的鈣三醇(Calcitriol)是哪種維生素的活性形式？",o:["維生素A","維生素B","維生素C","維生素D"],a:3,e:"鈣三醇是維生素D的活性形式。"},
{c:10,q:"腎臟的最小功能單位叫什麼？有多少個？",o:["腎小球，約50萬個","腎元，100多萬個","腎盂，約10萬個","腎管，約200萬個"],a:1,e:"腎臟有100多萬個腎元(Nephron)作為最小功能單位。"},
{c:10,q:"腎臟的過濾作用在哪個位置發生？",o:["腎盂","腎小體(鮑氏囊/腎小球)","輸尿管","膀胱"],a:1,e:"過濾作用在腎小體(Renal Corpuscle)，即鮑氏囊/腎小球位置發生。"},
{c:10,q:"連結腎臟和膀胱的結構是什麼？",o:["尿道","腎盂","輸尿管","腎動脈"],a:2,e:"輸尿管(Ureters)從腎盂延伸到膀胱後側基部。"},
{c:10,q:"男性尿道長約多少？",o:["4cm","10cm","20cm","30cm"],a:2,e:"男性尿道長約20cm。"},
{c:10,q:"女性尿道長約多少？",o:["4cm","10cm","15cm","20cm"],a:0,e:"女性尿道長約4cm，形狀是直管。"},
{c:10,q:"男性尿道除排尿外還有什麼功能？",o:["分泌激素","也是生殖系統的一部分","過濾血液","吸收營養"],a:1,e:"男性尿道排尿之外也是生殖系統的一部分。"},
{c:10,q:"以下哪個「不是」泌尿道的保護機制？",o:["尿液微酸度抑菌","尿流沖洗作用","膽汁殺菌","微生物共生作用"],a:2,e:"泌尿道保護機制：尿液酸度、尿流沖洗、前列腺/陰道口分泌物抑菌、尿素抑菌、微生物共生。"},

// ========== CH11 生殖系統 ==========
{c:11,q:"以下哪個「不是」男性生殖系統的功能？",o:["生產和運送精子","射出精子","製造雄性激素","產生卵子"],a:3,e:"男性生殖功能：生產保護運送精子和精液、射出精子、製造雄性激素。"},
{c:11,q:"睪丸在出生前幾週通過腹股溝管進入陰囊？",o:["2-4週","4-6週","6-8週","8-10週"],a:1,e:"睪丸在出生前4-6星期通過腹股溝管進入陰囊。"},
{c:11,q:"睪丸在男性胎兒期最初在哪裡發育？",o:["陰囊內","腹腔內","胸腔內","盆腔外"],a:1,e:"睪丸在男性胎兒期是在腹腔內發育，至出生前4-6週進入陰囊。"},
{c:11,q:"精子在女性生殖道內通常不超過多久？",o:["12小時","24小時","48小時","72小時"],a:2,e:"精子在女性生殖道內生存通常不超過48小時。"},
{c:11,q:"前列腺位於哪裡？",o:["腹腔上方","盆骨腔膀胱之下","胸腔內","頸部"],a:1,e:"前列腺位於盤骨腔膀胱之下，中央包含尿道。"},
{c:11,q:"卵巢製造的雌性激素包括？",o:["胰島素和升糖素","動情素和黃體素","甲狀腺素和降鈣素","腎上腺素和皮質醇"],a:1,e:"卵巢製造動情素(Estrogen)和黃體素(Progesterone)。"},
{c:11,q:"月經週期第14-28天的黃體期，子宮內膜有什麼變化？",o:["內膜脫落","血管分布增加，變為分泌性黏膜","內膜變薄","無變化"],a:1,e:"黃體期：子宮內膜血管分布增加，內層變為分泌性黏膜，子宮頸黏液增厚。"},
{c:11,q:"受精後第幾天囊胚完成著床？",o:["1-3天","4-6天","7-10天","14-21天"],a:2,e:"受精後第7-10天，囊胚完全埋入子宮體內膜完成著床。"},

// ========== CH12 內分泌系統 ==========
{c:12,q:"哪兩個系統負責維持身體的恆定？",o:["循環和呼吸系統","神經系統與內分泌系統","消化和泌尿系統","骨骼和肌肉系統"],a:1,e:"神經系統與內分泌系統負責維持身體的恆定。"},
{c:12,q:"內分泌系統的反應速度是多少？",o:["毫秒","秒","分鐘到小時(天)","即時"],a:2,e:"內分泌系統反應速度：分鐘-小時(天)；神經系統反應速度：秒。"},
{c:12,q:"神經系統的作用時間通常是多久？",o:["秒-分鐘","分鐘-天","小時-週","天-月"],a:0,e:"神經系統作用時間：秒-分鐘；內分泌系統作用時間：分鐘-天。"},
{c:12,q:"內分泌系統通過什麼方式傳遞訊息？",o:["電位訊號","化學訊號(激素)","機械振動","光訊號"],a:1,e:"內分泌系統以化學訊號通過激素運輸；神經系統以電位訊號通過神經元傳遞。"},
{c:12,q:"標靶細胞需要什麼才能讓激素發生影響？",o:["特定的神經連接","特定的激素接受器","特定的血管","特定的酵素"],a:1,e:"標靶細胞需要有特定的激素接受器(Specific receptor)。"},
{c:12,q:"以下哪個「不是」內分泌系統的功能？",o:["維持恆定","儲存利用能量物質","傳導神經衝動","調節生長與生殖"],a:2,e:"內分泌功能：維持恆定、儲存利用能量物質、調節生長生殖、控制壓力反應。"},
{c:12,q:"以下哪個器官可以分泌甲狀腺素？",o:["胰臟","腎上腺","甲狀腺","卵巢"],a:2,e:"甲狀腺分泌甲狀腺素（或降鈣素）。"},
{c:12,q:"腎上腺皮質分泌什麼激素？",o:["胰島素","甲狀腺素","皮質醇","動情素"],a:2,e:"腎上腺皮質分泌皮質醇（或醛固酮、雄性激素）。"},
{c:12,q:"腦下腺前葉分泌什麼激素？",o:["皮質醇","生長激素","甲狀腺素","胰島素"],a:1,e:"腦下腺前葉分泌生長激素（或甲狀腺刺激素、腎上腺皮質刺激素等）。"},
{c:12,q:"以下哪個「不是」甲狀腺素的功能？",o:["增加基礎代謝率","促進蛋白質合成","降低血糖","促進神經系統生長"],a:2,e:"甲狀腺素：增加代謝率、促進蛋白質合成、促進肝醣分解增加血糖、促進脂肪分解、促進神經生長、增加心跳。"},
{c:12,q:"甲狀腺素對心血管系統有什麼影響？",o:["減緩心跳","降低血壓","增加心跳速度和收縮力，血壓增加","無影響"],a:2,e:"甲狀腺素增加心跳速度和收縮力，血壓增加。"},
{c:12,q:"甲狀腺素對脂肪代謝有什麼影響？",o:["抑制脂肪分解","促進脂肪分解，增加游離脂肪酸","無影響","增加脂肪儲存"],a:1,e:"甲狀腺素促進脂肪分解，增加血液中的游離脂肪酸。"},
{c:12,q:"以下哪個「不是」腎上腺皮質醇的功能？",o:["促進肝醣分解使血糖增加","抑制免疫反應","增加骨密度","增加胃酸分泌"],a:2,e:"皮質醇功能包括增血糖、抗發炎、抑制免疫、導致骨質疏鬆(而非增加骨密度)、增胃酸。"},
{c:12,q:"皮質醇的哪個作用可能對骨骼有害？",o:["增加鈣吸收","導致骨質疏鬆","強化骨骼","促進骨骼生長"],a:1,e:"皮質醇會導致骨質疏鬆。"},
{c:12,q:"皮質醇對免疫系統有什麼影響？",o:["增強免疫","抑制免疫反應、抗發炎","無影響","產生抗體"],a:1,e:"皮質醇抑制免疫反應、抗發炎。"},
{c:12,q:"胰島素的作用是什麼？",o:["使血糖增加","使血糖下降","分解脂肪","合成蛋白質"],a:1,e:"胰島素：增加細胞利用血糖，使血糖下降。"},
{c:12,q:"升糖素的作用是什麼？",o:["使血糖下降","使血糖增加","抑制免疫","促進排泄"],a:1,e:"升糖素：促進肝醣分解和糖質新生，使血糖增加。"},
{c:12,q:"胰島素由胰臟蘭氏小島的哪種細胞分泌？",o:["α細胞","β細胞","γ細胞","δ細胞"],a:1,e:"胰島素由β細胞分泌。"},
{c:12,q:"升糖素由胰臟蘭氏小島的哪種細胞分泌？",o:["α細胞","β細胞","γ細胞","δ細胞"],a:0,e:"升糖素由α細胞分泌。"},

// ========== CH13 皮膚系統 ==========
{c:13,q:"以下哪個「不是」皮膚的功能？",o:["感覺","調節體溫","造血","合成維生素D"],a:2,e:"皮膚功能：感覺、調節體溫、保護、排泄吸收、合成維生素D。造血是骨髓功能。"},
{c:13,q:"皮膚的排泄功能透過什麼進行？",o:["毛髮","汗水排泄水分、碘、CO₂、氨和尿素","角質層","皮下脂肪"],a:1,e:"皮膚透過汗水排泄水分、碘、二氧化碳、氨和尿素，也能吸收細小物質。"},
{c:13,q:"皮膚主要分為哪三層？",o:["角質層、基底層、脂肪層","表皮層、真皮層、皮下組織","外層、中層、內層","上皮層、結締層、肌肉層"],a:1,e:"皮膚三層：表皮層、真皮層、皮下組織。"},
{c:13,q:"表皮層的角質層由什麼細胞組成？",o:["黑色素細胞","角質化複層鱗狀上皮細胞","成纖維細胞","脂肪細胞"],a:1,e:"表皮層角質層由角質化複層鱗狀上皮細胞(Stratified Epithelium)組成。"},
{c:13,q:"表皮層中最多的是什麼細胞？",o:["黑色素細胞","角質細胞","成纖維細胞","脂肪細胞"],a:1,e:"表皮層最多的是角質細胞，製造角蛋白。"},
{c:13,q:"角蛋白有什麼特性？",o:["柔軟有彈性","堅韌的纖維狀蛋白，密封和防水","容易溶解","透光性強"],a:1,e:"角蛋白是堅韌的纖維狀蛋白，成就皮膚的密封和防水特性。"},
{c:13,q:"真皮層「不包含」以下哪種結構？",o:["血管和神經","淋巴管","角質細胞","毛囊和皮脂腺"],a:2,e:"真皮層有：血管、神經、淋巴管、平滑肌、汗腺、毛囊、皮脂腺。角質細胞在表皮。"},
{c:13,q:"毛髮的顏色由什麼細胞造成？",o:["角質細胞","成纖維細胞","黑色素細胞","幹細胞"],a:2,e:"毛髮顏色是毛球內的黑色素細胞(Melanocytes)造成。"},
{c:13,q:"頂漿汗腺(Apocrine)主要分布在哪裡？",o:["手掌和腳掌","恥骨、腋下、乳頭、會陰部","全身皮膚","頭皮"],a:1,e:"頂漿汗腺主要分布在恥骨、腋下、乳頭、會陰部等區域。"},
{c:13,q:"外傷或感染會影響什麼結構的完整性和外貌？",o:["毛髮","指甲","皮下脂肪","肌肉"],a:1,e:"外傷或感染會影響指甲的完整性和外貌。"},
{c:13,q:"在皮下組織可以找到什麼細胞？",o:["神經細胞","肌肉細胞","脂肪細胞","上皮細胞"],a:2,e:"在皮下組織可以找到脂肪細胞。"},
{c:13,q:"筋膜(Fascia)的功能是什麼？",o:["產生激素","幫助組織附著穩定，包圍肌肉","過濾血液","傳遞電訊號"],a:1,e:"筋膜幫助組織附著和穩定，亦能包圍肌肉及將肌肉和內臟分開。"},
{c:13,q:"成纖維細胞(Fibroblast)可以合成什麼？",o:["紅血球和白血球","膠原纖維和彈性纖維等","神經遞質","激素"],a:1,e:"成纖維細胞可合成膠原纖維、糖胺聚醣、網狀纖維和彈性纖維。"},
{c:13,q:"以下哪個因素「不會」促使彈性纖維降解？",o:["炎症","日曬","充足睡眠","吸煙"],a:2,e:"炎症、日曬、吸煙可促使彈性纖維降解。"},
{c:13,q:"傷口修復的第一階段主要由什麼主導？",o:["膠原蛋白增生","血凝機制和白血球吞噬作用","上皮細胞覆蓋","疤痕形成"],a:1,e:"第一階段(第1-5日)由血凝機制和白血球吞噬作用主導。"},
{c:13,q:"傷口修復的第二階段有什麼特點？",o:["只有發炎","血管重塑、傷口收緊、新膠原蛋白形成","疤痕完全消失","只有出血"],a:1,e:"第二階段(10日-4週)：血管重塑、自然清創、傷口收緊、新膠原蛋白形成、上皮細胞覆蓋。"},
{c:13,q:"傷口修復的第三階段為期多久？",o:["1-5日","10日-4週","4週至2年","3-5年"],a:2,e:"第三階段為期4週至2年，膠原蛋白逐漸增加強化疤痕。"},
{c:13,q:"紫外線令皮膚內什麼物質轉為維生素D前體？",o:["膠原蛋白","去氫膽固醇","角蛋白","黑色素"],a:1,e:"紫外線令皮膚內的去氫膽固醇轉為維生素D的前體。"},

// ========== CH14 感覺系統 ==========
{c:14,q:"人類的五感是什麼？",o:["視覺、聽覺、痛覺、壓覺、溫覺","嗅覺、味覺、聽覺、視覺、觸覺","視覺、聽覺、平衡覺、嗅覺、痛覺","味覺、嗅覺、壓覺、溫覺、視覺"],a:1,e:"五感：嗅覺、味覺、聽覺、視覺和觸覺。"},
{c:14,q:"嗅覺的作用是什麼？",o:["只是分辨食物","分辨氣味及提供安全和愉悅感","調節呼吸","控制食慾"],a:1,e:"嗅覺：分辨不同氣味，以及提供安全、愉悅感。"},
{c:14,q:"嗅覺上皮層含有什麼可再生的細胞？",o:["角質細胞","基底細胞(幹細胞)","神經元","黑色素細胞"],a:1,e:"嗅覺上皮層含有再生性的基底細胞(Basal cells)，即幹細胞。"},
{c:14,q:"嗅覺感受器只能被什麼類型的化合物活化？",o:["氣態化合物","可溶於水或脂質的化合物","酸性化合物","金屬離子"],a:1,e:"嗅覺感受器只能被可溶於水或脂質的化合物活化。"},
{c:14,q:"嗅覺衝動沿著第幾對顱神經傳遞？",o:["第一對(CN1)","第二對(CN2)","第七對(CN7)","第十對(CN10)"],a:0,e:"嗅覺沿著嗅神經/第一對顱神經(CN1)傳遞到嗅覺皮質區。"},
{c:14,q:"嗅覺衝動最終傳達到腦部哪個區域進行詮釋？",o:["額葉","嗅覺皮質區顳葉海馬迴","小腦","腦幹"],a:1,e:"嗅覺衝動傳達到嗅覺皮質區顳葉海馬迴進行感覺的詮釋，亦可傳送至下視丘和邊緣系統。"},
{c:14,q:"味覺有什麼作用？",o:["調節體溫","保護人體不受毒物傷害，增進食慾","平衡身體","傳遞訊號"],a:1,e:"味覺：保護人體不受毒物傷害，增進食慾。"},
{c:14,q:"耳朵分為哪三個部分？",o:["上耳、中耳、下耳","外耳、中耳、內耳","前耳、中耳、後耳","左耳、右耳、中耳"],a:1,e:"耳朵分為外耳、中耳和內耳。"},
{c:14,q:"耳朵整體而言有什麼作用？",o:["只負責聽覺","負責聽覺傳導和維持平衡","只負責平衡","負責嗅覺"],a:1,e:"耳朵負責聽覺傳導，內耳也負責維持平衡。"},
{c:14,q:"耳朵內什麼結構可以保護防止外物進入？",o:["耳膜","油脂、蠟(耳垢)和毛髮","耳咽管","半規管"],a:1,e:"油脂和蠟(耳垢)可以潤滑耳道、殺菌，並與毛髮保護防止外物進入。"},
{c:14,q:"平衡覺和聽覺由什麼產生？",o:["外耳的接受器","中耳的接受器","內耳的接受器","大腦皮質"],a:2,e:"平衡覺和聽覺是由內耳的接受器所產生。"},
{c:14,q:"耳咽管的功能是什麼？",o:["傳導聲音","平衡鼓膜兩側氣壓","產生耳垢","維持平衡"],a:1,e:"耳咽管與鼻咽連接，開啟時空氣流通，平衡鼓膜兩側氣壓。"},
{c:14,q:"造成近視的原因是什麼？",o:["眼球太短或水晶體太薄","眼球太長或水晶體太厚","角膜損傷","視網膜脫落"],a:1,e:"近視：眼球太長或水晶體太厚，影像焦距落於視網膜之前。"},
{c:14,q:"造成遠視的原因是什麼？",o:["眼球太長或水晶體太厚","眼球太短或水晶體太薄","瞳孔太大","角膜彎曲度不均"],a:1,e:"遠視：眼球太短或水晶體太薄，影像落於視網膜之後。"},

// ========== CH15 懷孕與生產 ==========
{c:15,q:"卵子和精子結合後形成什麼？",o:["胚胎","受精卵(合子)","囊胚","胎盤"],a:1,e:"卵子和精子結合之後形成受精卵(合子)。"},
{c:15,q:"植入(Implantation)通常在受孕後第幾天完成？",o:["第3-5天","第7-8天","第10-11天","第14-15天"],a:2,e:"植入通常在受孕後第10至11天完成。"},
{c:15,q:"胎齡從什麼時候開始計算？",o:["受精當天","植入當天","末次月經第一天","確認懷孕當天"],a:2,e:"胎齡從末次月經(LMP)的第一天開始計算。"},
{c:15,q:"以下哪個「不是」胎盤的功能？",o:["輸送營養和氧氣","清除胎兒廢物","合成蛋白質和激素","產生免疫細胞"],a:3,e:"胎盤功能：輸送營養氧氣、清除廢物、合成蛋白質和激素。"},
{c:15,q:"胎兒心臟在妊娠第幾週開始跳動？",o:["第2-3週","第4-5週","第8-9週","第12-13週"],a:1,e:"心臟在妊娠第4-5週時開始跳動。"},
{c:15,q:"胎兒體內的免疫球蛋白G(IgG)幾乎完全來自哪裡？",o:["胎兒自己產生","母體","胎盤","臍帶"],a:1,e:"胎兒體內的IgG幾乎完全來自母體。"},
{c:15,q:"以下哪個「不是」懷孕常見的不適？",o:["背痛","靜脈曲張","骨折","便秘"],a:2,e:"懷孕不適：背痛、皮膚擴張、抽筋、靜脈曲張、便秘、呼吸困難、晨吐等。"},
{c:15,q:"懷孕期間黃體激素上升會導致什麼？",o:["增加平滑肌活動","減少平滑肌活動和體溫升高","降低體溫","增加免疫力"],a:1,e:"黃體激素上升：減少平滑肌活動(引起鬆弛)和體溫升高。"},
{c:15,q:"懷孕期間雌激素上升會促進什麼？",o:["降低乳房發育","促進乳房生長及增加對催產素的敏感度","降低體溫","減少食慾"],a:1,e:"雌激素上升：促進乳房生長、乳暈色素沉著、增加子宮對催產素敏感度。"},
{c:15,q:"人類胎盤泌乳素(hPL)有什麼功能？",o:["降低血糖","促進生長素及胰島素分泌，使母體醣份集中給胎兒","抑制乳房生長","降低體溫"],a:1,e:"hPL促進生長素及胰島素分泌，同時降低胰島素在周邊組織的利用，使母體醣份集中給胎兒。"},

// ===================== STATE =====================
let state={screen:'home',pool:[],idx:0,answers:{},score:0,wrong:[],bookmarks:new Set(),mode:'',chapter:0,timer:0,timerRef:null,totalQ:0,history:{}};

// ===================== UTILS =====================
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getChQ(ch){return Q.filter(q=>q.c===ch);}
function pct(n,t){return t?Math.round(n/t*100):0;}
const $=id=>document.getElementById(id);
const app=$('app');
const modalRoot=$('modalRoot');

function startTimer(){
  state.timer=0;$('timerEl').classList.remove('hidden');clearInterval(state.timerRef);
  state.timerRef=setInterval(()=>{state.timer++;let m=String(Math.floor(state.timer/60)).padStart(2,'0');let s=String(state.timer%60).padStart(2,'0');$('timerEl').textContent=m+':'+s;},1000);
}
function stopTimer(){clearInterval(state.timerRef);$('timerEl').classList.add('hidden');}
function toggleDark(){document.documentElement.classList.toggle('dark');}

function showModal(msg,onYes,onNo){
  modalRoot.innerHTML=`<div class="modal-bg" onclick="event.target===this&&closeModal()">
  <div class="modal-box bg-white rounded-2xl shadow-xl p-6 mx-4 max-w-sm w-full">
  <p class="text-gray-800 font-medium mb-5 text-center">${msg}</p>
  <div class="flex gap-3">
  <button onclick="closeModal();(${onNo||(()=>{})})();" class="flex-1 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium text-sm hover:bg-gray-50">取消</button>
  <button id="modalYesBtn" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700">確定</button>
  </div></div></div>`;
  $('modalYesBtn').onclick=()=>{closeModal();onYes();};
}
function closeModal(){modalRoot.innerHTML='';}

// ===================== RENDER =====================
function render(){
  stopTimer();
  switch(state.screen){
    case'home':renderHome();break;
    case'chapters':renderChapters();break;
    case'countSelect':renderCountSelect();break;
    case'quiz':renderQuiz();startTimer();break;
    case'results':renderResults();break;
  }
}

function renderHome(){
  let totalAnswered=Object.keys(state.history).length;
  let totalCorrect=Object.values(state.history).filter(v=>v).length;
  let wrongCount=state.wrong.length;
  let bmCount=state.bookmarks.size;
  app.innerHTML=`
<div class="fade-in">
<div class="text-center mb-8">
<div class="text-5xl mb-3">🧬</div>
<h1 class="text-2xl font-bold text-gray-800 mb-1">解剖生理學</h1>
<p class="text-gray-500 text-sm">模擬考試題庫 ・ 共 ${Q.length} 題</p>
${totalAnswered?`<p class="text-xs text-blue-600 mt-2">已練習 ${totalAnswered} 題 ・ 正確率 ${pct(totalCorrect,totalAnswered)}%</p>`:''}
</div>
<div class="space-y-3">
<button onclick="startMode('all')" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-4 text-left flex items-center gap-3 shadow-sm">
<span class="text-2xl">🎲</span><div><div class="font-bold">全部隨機測驗</div><div class="text-xs text-blue-200">從所有章節隨機出題</div></div>
</button>
<button onclick="goScreen('chapters')" class="w-full bg-white hover:bg-gray-50 border border-gray-200 rounded-xl p-4 text-left flex items-center gap-3 shadow-sm">
<span class="text-2xl">📚</span><div><div class="font-bold text-gray-800">按章節測驗</div><div class="text-xs text-gray-500">選擇特定章節練習</div></div>
</button>
<button onclick="startMode('wrong')" class="w-full bg-white hover:bg-gray-50 border border-gray-200 rounded-xl p-4 text-left flex items-center gap-3 shadow-sm ${wrongCount?'':'opacity-50'}">
<span class="text-2xl">❌</span><div><div class="font-bold text-gray-800">錯題重溫</div><div class="text-xs text-gray-500">${wrongCount?'共 '+wrongCount+' 題錯題':'暫無錯題記錄'}</div></div>
</button>
<button onclick="startMode('bookmark')" class="w-full bg-white hover:bg-gray-50 border border-gray-200 rounded-xl p-4 text-left flex items-center gap-3 shadow-sm ${bmCount?'':'opacity-50'}">
<span class="text-2xl">⭐</span><div><div class="font-bold text-gray-800">收藏題目</div><div class="text-xs text-gray-500">${bmCount?'共 '+bmCount+' 題收藏':'暫無收藏題目'}</div></div>
</button>
<button onclick="showModal('確定要清除所有錯題、收藏和練習記錄嗎？',resetAll)" class="w-full bg-white hover:bg-gray-50 border border-gray-200 rounded-xl p-4 text-left flex items-center gap-3 shadow-sm">
<span class="text-2xl">🔄</span><div><div class="font-bold text-gray-800">重置所有記錄</div><div class="text-xs text-gray-500">清除錯題和收藏記錄</div></div>
</button>
</div>
</div>`;
}

function renderChapters(){
  let html=`<div class="fade-in"><h2 class="text-lg font-bold text-gray-800 mb-4">📚 選擇章節</h2><div class="space-y-2">`;
  for(let c=1;c<=16;c++){
    let cnt=getChQ(c).length;
    let done=getChQ(c).filter(q=>state.history[Q.indexOf(q)]!==undefined).length;
    html+=`<button onclick="startMode('chapter',${c})" class="w-full bg-white hover:bg-blue-50 border border-gray-200 rounded-xl p-3 text-left flex items-center justify-between shadow-sm">
    <div class="flex-1 min-w-0"><div class="font-medium text-gray-800 text-sm truncate">${c}. ${CH[c]}</div><div class="text-xs text-gray-400">${cnt} 題${done?' ・ 已做 '+done+' 題':''}</div></div>
    <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>`;
  }
  html+=`</div><button onclick="goScreen('home')" class="mt-4 text-blue-600 text-sm font-medium">← 返回主頁</button></div>`;
  app.innerHTML=html;
}

function renderCountSelect(){
  let total=state.pool.length;
  let counts=[10,20,30,50,total].filter(n=>n<=total);
  counts=[...new Set(counts)];
  let html=`<div class="fade-in"><h2 class="text-lg font-bold text-gray-800 mb-4">📝 選擇題數</h2><div class="space-y-2">`;
  counts.forEach(n=>{
    let label=n===total?`全部 (${total} 題)`:n+' 題';
    html+=`<button onclick="beginQuiz(${n})" class="w-full bg-white hover:bg-blue-50 border border-gray-200 rounded-xl p-4 text-center font-medium text-gray-800 shadow-sm">${label}</button>`;
  });
  html+=`</div><button onclick="goScreen('home')" class="mt-4 text-blue-600 text-sm font-medium">← 返回主頁</button></div>`;
  app.innerHTML=html;
}

function renderQuiz(){
  let q=state.pool[state.idx];
  let qIdx=Q.indexOf(q);
  let answered=state.answers[state.idx]!==undefined;
  let selected=state.answers[state.idx];
  let isBm=state.bookmarks.has(qIdx);
  let progress=pct(state.idx+1,state.totalQ);
  let labels=['A','B','C','D'];

  let html=`<div class="fade-in">
  <div class="flex items-center justify-between mb-2">
    <button onclick="confirmQuit()" class="text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>結束測驗</button>
    <span class="text-xs font-medium text-gray-500">${state.idx+1} / ${state.totalQ}</span>
    <span class="text-xs px-2 py-1 rounded-full bg-blue-50 text-blue-700 font-medium truncate max-w-32">${CH[q.c]}</span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-1.5 mb-4"><div class="bg-blue-600 h-1.5 rounded-full transition-all" style="width:${progress}%"></div></div>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-4">
    <p class="text-gray-800 font-medium leading-relaxed">${q.q}</p>
  </div>
  <div class="space-y-2 mb-4">`;

  q.o.forEach((opt,i)=>{
    let cls='opt-btn w-full border rounded-xl p-4 text-left flex items-center gap-3 text-sm';
    if(answered){
      cls+=' answered';
      if(i===q.a) cls+=' opt-correct';
      else if(i===selected&&i!==q.a) cls+=' opt-wrong';
      else cls+=' bg-white border-gray-200 text-gray-500 opacity-60';
    } else {
      cls+=' bg-white border-gray-200 text-gray-700 hover:border-blue-400 cursor-pointer';
    }
    html+=`<button onclick="selectOpt(${i})" class="${cls}">
    <span class="w-7 h-7 rounded-full ${answered&&i===q.a?'bg-green-600 text-white':answered&&i===selected?'bg-red-500 text-white':'bg-gray-100 text-gray-600'} flex items-center justify-center text-xs font-bold flex-shrink-0">${labels[i]}</span>
    <span class="flex-1">${opt}</span>
    ${answered&&i===q.a?'<span class="ml-auto text-green-600 flex-shrink-0">✓</span>':''}
    ${answered&&i===selected&&i!==q.a?'<span class="ml-auto text-red-500 flex-shrink-0">✗</span>':''}
    </button>`;
  });
  html+=`</div>`;

  if(answered){
    html+=`<div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4 text-sm text-blue-800 leading-relaxed">
    <div class="font-bold mb-1">💡 解析</div>${q.e}</div>`;
  }

  html+=`<div class="flex items-center justify-between">
    <button onclick="toggleBookmark(${qIdx})" class="text-2xl" title="${isBm?'取消收藏':'收藏'}">${isBm?'⭐':'☆'}</button>
    <div class="flex gap-2">`;
  if(state.idx>0) html+=`<button onclick="prevQ()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 text-sm font-medium hover:bg-gray-50">上一題</button>`;
  if(answered){
    if(state.idx<state.totalQ-1)
      html+=`<button onclick="nextQ()" class="px-6 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700">下一題 →</button>`;
    else
      html+=`<button onclick="finishQuiz()" class="px-6 py-2 rounded-lg bg-green-600 text-white text-sm font-bold hover:bg-green-700">查看成績 🎉</button>`;
  }
  html+=`</div></div></div>`;
  app.innerHTML=html;
}

function renderResults(){
  let correct=0;let chStats={};
  for(let i=0;i<state.totalQ;i++){
    let q=state.pool[i];
    if(!chStats[q.c]) chStats[q.c]={total:0,correct:0};
    chStats[q.c].total++;
    if(state.answers[i]===q.a){correct++;chStats[q.c].correct++;}
  }
  let p=pct(correct,state.totalQ);
  let emoji=p>=80?'🎉':p>=60?'👍':p>=40?'💪':'📖';
  let msg=p>=80?'太棒了！':p>=60?'做得不錯！':p>=40?'繼續加油！':'需要多複習！';

  let html=`<div class="fade-in text-center">
  <div class="text-6xl mb-2">${emoji}</div>
  <h2 class="text-2xl font-bold text-gray-800 mb-1">${msg}</h2>
  <p class="text-gray-500 mb-4">用時 ${$('timerEl').textContent||'--:--'}</p>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-4">
    <div class="text-5xl font-black ${p>=60?'text-green-600':'text-orange-500'} mb-1">${p}%</div>
    <div class="text-gray-500 text-sm">${correct} / ${state.totalQ} 題正確</div>
  </div>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4 text-left">
    <h3 class="font-bold text-gray-700 text-sm mb-3">📊 各章節表現</h3><div class="space-y-2">`;
  Object.keys(chStats).sort((a,b)=>a-b).forEach(c=>{
    let s=chStats[c];let cp=pct(s.correct,s.total);
    let barColor=cp>=80?'bg-green-500':cp>=60?'bg-yellow-500':'bg-red-500';
    html+=`<div><div class="flex justify-between text-xs mb-1"><span class="text-gray-600 truncate max-w-xs">${CH[c]}</span><span class="font-medium ${cp>=60?'text-green-600':'text-red-600'}">${s.correct}/${s.total} (${cp}%)</span></div>
    <div class="w-full bg-gray-200 rounded-full h-2"><div class="${barColor} h-2 rounded-full" style="width:${cp}%"></div></div></div>`;
  });
  html+=`</div></div>
  <div class="space-y-2">
  <button onclick="startMode('wrong')" class="w-full bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 rounded-xl p-3 font-medium text-sm ${state.wrong.length?'':'opacity-50 pointer-events-none'}">❌ 重做錯題 (${state.wrong.length} 題)</button>
  <button onclick="goScreen('home')" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-3 font-bold text-sm">🏠 返回題庫主頁</button>
  </div></div>`;
  app.innerHTML=html;
}

// ===================== ACTIONS =====================
function goScreen(s){state.screen=s;render();}

function confirmQuit(){
  showModal('確定要結束測驗並返回題庫主頁嗎？<br><span class="text-xs text-gray-400">（已作答的題目會保留記錄）</span>',()=>{stopTimer();goScreen('home');});
}

function startMode(mode,ch){
  state.mode=mode;state.chapter=ch||0;let pool=[];
  if(mode==='all') pool=shuffle(Q);
  else if(mode==='chapter') pool=shuffle(getChQ(ch));
  else if(mode==='wrong'){if(!state.wrong.length)return;pool=shuffle(state.wrong.map(i=>Q[i]));}
  else if(mode==='bookmark'){if(!state.bookmarks.size)return;pool=shuffle([...state.bookmarks].map(i=>Q[i]));}
  state.pool=pool;
  if(pool.length<=10) beginQuiz(pool.length);
  else{state.screen='countSelect';render();}
}

function beginQuiz(n){
  state.pool=state.pool.slice(0,n);state.totalQ=n;state.idx=0;state.answers={};state.score=0;state.screen='quiz';render();
}

function selectOpt(i){
  if(state.answers[state.idx]!==undefined)return;
  state.answers[state.idx]=i;let q=state.pool[state.idx];let qIdx=Q.indexOf(q);
  if(i===q.a){state.score++;state.history[qIdx]=true;let wi=state.wrong.indexOf(qIdx);if(wi>-1)state.wrong.splice(wi,1);}
  else{state.history[qIdx]=false;if(!state.wrong.includes(qIdx))state.wrong.push(qIdx);}
  renderQuiz();
}

function nextQ(){if(state.idx<state.totalQ-1){state.idx++;renderQuiz();}}
function prevQ(){if(state.idx>0){state.idx--;renderQuiz();}}
function finishQuiz(){stopTimer();state.screen='results';render();}
function toggleBookmark(i){if(state.bookmarks.has(i))state.bookmarks.delete(i);else state.bookmarks.add(i);if(state.screen==='quiz')renderQuiz();}
function resetAll(){state.wrong=[];state.bookmarks=new Set();state.history={};state.answers={};render();}

render();
</script>
</body>
</html>
